name: Deploy to Production on Tag
on:
  push:
    tags:
      - 'v*' # Triggers only on tags like v1.0.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # CRITICAL FIX: This ensures the EXACT commit tagged is checked out,
          # not the latest commit on the branch.
          ref: ${{ github.ref }} 
          fetch-depth: 0 # Fetches all history so Vercel can see the tag context

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}   